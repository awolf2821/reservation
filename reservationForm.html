<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Reserve</title>
        <script src="js/init.js"></script>
<style>
</style>
    </head>
    <body>
        <header>
         <h1>Make a Reservation</h1>
        </header>
        <section id="form">
            <h2>Reservation Form</h2>
            <form action="#" method="POST">
                <section id="basicInfo">
                    <h3>Basic Information</h2>
                <label for="firstName">Name(first, last):</label>
                <input id="firstName" type="text" name="firstName" required>
                <input id="lastName" type="text" name="lastName" required>
                <br>
                <label for="email">Email:</label>
                <input id="email" type="email" name="email">
                <br>
                <label for="phone">Phone Number:</label>
                <input id="phone" type="tel" name="phone">
                <br>
                <label for="headcount"># Of People in Party:</label>
                <input id="headcount" type="number" name="headcount" required>
                <br>
                </section>
                <section id="reservationTime">
                    <h3>Reservation Time</h3>
                <p>Please select your reservation time.</p>
                <input list="times" name="times">
                    <datalist id="times">
                        <option value="4:00">
                        <option value="4:15">
                        <option value="4:30">
                        <option value="4:45">
                        <option value="5:00">
                        <option value="5:15">
                        <option value="5:30">
                        <option value="5:45">
                        <option value="6:00">
                    </datalist>
                    <br>
                </section>
                <section id="otherInfo">
                    <h3>Other Info</h3>
                <p>Does anyone in your party have allergies?</p>
                <input id="allergiesYes" type="radio" name="allergies" value="Y">
                <label for="allergiesYes">Yes</label>
                <br>
                <input id="allergiesNo" type="radio" name="allergies" value="N">
                <label for="allergiesNo">No</label>
                <p>Does anybody in your party need special accomodations?(e.g. wheelchair seating)</p>
                <input id="seatingYes" type="radio" name="accSeating" value="Y">
                <label for="seatingYes">Yes</label>
                <br>
                <input id="seatingNo" type="radio" name="accSeating" value="N">
                <label for="seatingNo">No</label>
                <p>Do you have any other notes?</p>
                <textarea  id="notes" rows="5" cols="50" maxlength="500" placeholder="Write Here">
                </textarea>
                </section>
                <div id="submit">
                    <input type="submit" value="Reserve">
                    <input type="reset" value="Clear Form">
                </div>
        </section>
    </body>
</html>
