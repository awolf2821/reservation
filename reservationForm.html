<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Reserve</title>
        <script src="js/init.js"></script>
<style>
</style>
    </head>
    <body>
        <header>
         <h1>Make a Reservation</h1>
        </header>
        <section id="form">
            <h2>Reservation Form</h2>
            <form action="#" method="POST">
                <label for="name">Reservation Name:</label>
                <input id="name" type="text" name="reservationName" required>
                <br>
                <label for="headcount"># Of People in Party:</label>
                <input id="headcount" type="number" name="headcount" required>
                <br>
                <p>Please select your reservation time.</p>
                <input list="times" name="times">
                    <datalist id="times">
                        <option value="4:00">
                        <option value="4:15">
                        <option value="4:30">
                        <option value="4:45">
                        <option value="5:00">
                        <option value="5:15">
                        <option value="5:30">
                        <option value="5:45">
                        <option value="6:00">
                    </datalist>
                    <br>    
                <label for="allergies">Are there any allergies in your party?</label>
                <input id="allergies" type="radio" name="allergies" required value="Yes">
